services:
  - type: web
    name: skillswap-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_NAME
        value: skillswap
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URL
        sync: false
